name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-ci:
    name: windows-ci
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python compilation
        run: python -B -m compileall -q core tests

      - name: Run Python suite (B4 Windows Hello/TPM tests excluded; SDK wire tests run in the next step)
        run: python -B -m pytest -p no:cacheprovider -q --tb=short

      - name: Run MCP SDK v2.3.0 wire tests (isolated venv)
        run: |
          python -m venv .sdkvenv
          .sdkvenv\Scripts\python -m pip install mcp==2.3.0 -r requirements-dev.txt
          .sdkvenv\Scripts\python -B -m pytest -p no:cacheprovider -q --tb=short tests/test_mcp_protocol_wire_resilience.py

      - name: Run PowerShell installer tests (preflight, locks, rollback)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/test_installer_preflight.ps1
